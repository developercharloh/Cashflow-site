        reward:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
        fundingBudget:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
        maxCompletions:
          type: integer
          minimum: 1
          maximum: 500
        minLevel:
          type: integer
          minimum: 1
          maximum: 7

    TaskFileInput:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

