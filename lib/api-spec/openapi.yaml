components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        phone:
          type: string
        country:
          type: string
        referralCode:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string

    VerifyEmailInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, email, name, level, balance, pendingEarnings, totalWithdrawn, referralCode, referralCount, tasksCompleted, isEmailVerified, isAdmin, quizCompleted, welcomeGiftClaimed, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        phone:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        level:
          type: integer
        levelName:
          type: string
        balance:
          type: number
        pendingEarnings:
          type: number
        totalWithdrawn:
          type: number
        referralCode:
          type: string
        referralCount:
          type: integer
        tasksCompleted:
          type: integer
        isEmailVerified:
          type: boolean
        isAdmin:
          type: boolean
        quizCompleted:
          type: boolean
        welcomeGiftClaimed:
          type: boolean
        isBanned:
          type: boolean
        transcriptionMinutes:
          type: number
        membershipPurchased:
          type: boolean
        createdAt:
          type: string

    # ── Quiz ──────────────────────────────────────────────────────────────────
    QuizQuestion:
      type: object
      required: [id, question, options]
      properties:
        id:
          type: integer
        question:
          type: string
        options:
          type: array
          items:
            type: string

    QuizSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId:
                type: integer
              answer:
                type: string

    QuizResult:
      type: object
      required: [score, totalQuestions, bonusEarned, message]
      properties:
        score:
          type: integer
        totalQuestions:
          type: integer
        bonusEarned:
          type: number
        message:
          type: string

    # ── Dashboard ─────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [balance, pendingEarnings, totalWithdrawn, level, levelName, levelProgress, referralCount, tasksCompleted, tasksAvailable, streakDays]
      properties:
        balance:
          type: number
        pendingEarnings:
          type: number
        totalWithdrawn:
          type: number
        level:
          type: integer
        levelName:
          type: string
        levelProgress:
          type: number
        referralCount:
          type: integer
        tasksCompleted:
          type: integer
        tasksAvailable:
          type: integer
        streakDays:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, amount, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        amount:
          type: ["number", "null"]
        createdAt:
          type: string

    ChartDataPoint:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
        amount:
          type: number

    # ── Tasks ─────────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, title, description, category, taskType, reward, fundingBudget, maxCompletions, estimatedMinutes, difficulty, minLevel, isActive]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        assetUrl:
          type: ["string", "null"]
        category:
          type: string
        taskType:
          type: string
        reward:
          type: number
        fundingBudget:
          type: number
        maxCompletions:
          type: integer
        estimatedMinutes:
          type: integer
        timeLimitSeconds:
          type: ["integer", "null"]
        minutesCost:
          type: ["number", "null"]
        difficulty:
          type: string
        minLevel:
          type: integer
        isActive:
          type: boolean
        questionCount:
          type: integer
        cooldownHours:
          type: ["integer", "null"]
        onCooldown:
          type: boolean
        cooldownEndsAt:
          type: ["string", "null"]
        completedByUser:
          type: boolean
        instructions:
          type: ["string", "null"]

    TaskCategory:
      type: object
      required: [name, count, totalReward]
      properties:
        name:
          type: string
        count:
          type: integer
        totalReward:
          type: number
        icon:
          type: ["string", "null"]

    UserTask:
      type: object
      required: [id, taskId, userId, status, startedAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        userId:
          type: integer
        status:
          type: string
        startedAt:
          type: string
        completedAt:
          type: ["string", "null"]

    TaskStartResult:
      type: object
      required: [attemptId, questions, totalQuestions]
      properties:
        attemptId:
          type: integer
        timeLimitSeconds:
          type: ["integer", "null"]
        totalQuestions:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/TaskQuestion"

    TaskQuestion:
      type: object
      required: [id, question, options, difficulty]
      properties:
        id:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            type: string
        difficulty:
          type: string

    TaskSubmitInput:
      type: object
      required: [attemptId, answers]
      properties:
        attemptId:
          type: integer
        timeSpent:
          type: ["integer", "null"]
        answers:
          type: array
          items:
            type: object
            required: [questionId, answer]
            properties:
              questionId:
                type: string
              answer:
                type: string

    TaskSubmitResult:
      type: object
      required: [passed, score, correctAnswers, totalQuestions, message, rewardEarned]
      properties:
        passed:
          type: boolean
        score:
          type: integer
        correctAnswers:
          type: integer
        totalQuestions:
          type: integer
        message:
          type: string
        rewardEarned:
          type: number
        newBalance:
          type: ["number", "null"]

    TaskAttemptSummary:
      type: object
      required: [id, taskId, taskTitle, taskCategory, status, score, totalQuestions, correctAnswers, rewardEarned, startedAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        taskTitle:
          type: string
        taskCategory:
          type: string
        status:
          type: string
        score:
          type: integer
        totalQuestions:
          type: integer
        correctAnswers:
          type: integer
        rewardEarned:
          type: number
        timeSpent:
          type: ["integer", "null"]
        startedAt:
          type: string
        completedAt:
          type: ["string", "null"]

    TaskCompletionInput:
      type: object
      properties:
        proof:
          type: ["string", "null"]

    TaskCompletionResult:
      type: object
      required: [success, rewardEarned, message]
      properties:
        success:
          type: boolean
        rewardEarned:
          type: number
        message:
          type: string
        newBalance:
          type: number

    CheckInResult:
      type: object
      required: [success, rewardEarned, streakDays, message]
      properties:
        success:
          type: boolean
        rewardEarned:
          type: number
        streakDays:
          type: integer
        message:
          type: string

    TaskInput:
      type: object
      required: [title, description, category, reward, fundingBudget, maxCompletions, estimatedMinutes, difficulty, minLevel, instructions]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        reward:
          type: number
        fundingBudget:
          type: number
        maxCompletions:
          type: integer
        estimatedMinutes:
          type: integer
        difficulty:
          type: string
        minLevel:
          type: integer
        instructions:
          type: string
        taskType:
          type: string
        isActive:
          type: boolean

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        reward:
          type: number
        isActive:
          type: boolean
        minLevel:
          type: integer
        difficulty:
          type: string
        estimatedMinutes:
          type: integer
        fundingBudget:
          type: number
        maxCompletions:
          type: integer
        category:
          type: string
        instructions:
          type: string
        taskType:
          type: string

    TaskFeedSourceInput:
      type: object
      required: [name, feedUrl, licenseName, licenseUrl, allowedCategories, reuseRightsConfirmed]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        feedUrl:
          type: string
          format: uri
          maxLength: 2048
        licenseName:
          type: string
          minLength: 3
          maxLength: 120
        licenseUrl:
          type: string
          format: uri
          maxLength: 2048
        allowedCategories:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [Academic Writing, Data Entry, Transcription, AI Training]
        reuseRightsConfirmed:
          type: boolean

    TaskFeedSource:
      type: object
      required: [id, name, feedUrl, licenseName, licenseUrl, allowedCategories, isActive, lastSyncStatus, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        feedUrl:
          type: string
          format: uri
        licenseName:
          type: string
        licenseUrl:
          type: string
          format: uri
        allowedCategories:
          type: array
          items:
            type: string
            enum: [Academic Writing, Data Entry, Transcription, AI Training]
        isActive:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncStatus:
          type: string
          enum: [never, success, warning, failed]
        lastSyncMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskFeedImport:
      type: object
      required: [id, sourceId, externalId, title, description, instructions, category, estimatedMinutes, sourceUrl, sourceNameSnapshot, licenseNameSnapshot, licenseUrlSnapshot, status, createdAt, updatedAt, sourceActive]
      properties:
        id:
          type: integer
        sourceId:
          type: integer
        externalId:
          type: string
        title:
          type: string
        description:
          type: string
        instructions:
          type: string
        category:
          type: string
          enum: [Academic Writing, Data Entry, Transcription, AI Training]
        estimatedMinutes:
          type: integer
        sourceUrl:
          type: string
          format: uri
        sourceNameSnapshot:
          type: string
        licenseNameSnapshot:
          type: string
        licenseUrlSnapshot:
          type: string
          format: uri
        status:
          type: string
          enum: [pending, published, skipped]
        publishedTaskId:
          type: integer
          nullable: true
        sourceActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskFeedSync:
      type: object
      required: [source, imported, duplicates, skippedUnsupported, skippedInvalid]
      properties:
        source:
          $ref: "#/components/schemas/TaskFeedSource"
        imported:
          type: integer
        duplicates:
