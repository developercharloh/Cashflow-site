name: Deploy Elite Signals Pro

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/task-earn-pro run build

      - name: Deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          npx vercel deploy artifacts/task-earn-pro/dist \
            --token "$VERCEL_TOKEN" --prod --yes --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
