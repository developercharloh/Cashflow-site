name: Deploy Elite Signals Pro

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/task-earn-pro run build

      - name: Pull Vercel project settings
        working-directory: artifacts/task-earn-pro
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Structure Vercel prebuilt output
        working-directory: artifacts/task-earn-pro
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/public/. .vercel/output/static/
          python3 -c "
          import json
          config = {
            'version': 3,
            'routes': [
              {
                'src': '/api/(.*)',
                'dest': 'https://github-importer-jakejamesgu.replit.app/api/\$1',
                'headers': {'X-Forwarded-Host': 'elite-signals-pro-alpha.vercel.app'}
              },
              {'handle': 'filesystem'},
              {'src': '/(.*)', 'dest': '/index.html'}
            ]
          }
          print(json.dumps(config, indent=2))
          " > .vercel/output/config.json
          echo "=== config.json ===" && cat .vercel/output/config.json
          echo "=== static files ===" && ls .vercel/output/static/

      - name: Deploy prebuilt output to Vercel
        working-directory: artifacts/task-earn-pro
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
