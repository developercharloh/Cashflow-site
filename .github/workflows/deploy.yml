name: Deploy Elite Signals Pro

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/task-earn-pro run build

      - name: Structure Vercel prebuilt output
        run: |
          mkdir -p artifacts/task-earn-pro/.vercel/output/static
          cp -r artifacts/task-earn-pro/dist/. artifacts/task-earn-pro/.vercel/output/static/
          echo '{"version":3}' > artifacts/task-earn-pro/.vercel/output/config.json

      - name: Pull Vercel project settings
        working-directory: artifacts/task-earn-pro
        run: |
          npx vercel pull --yes --environment=production \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to Vercel
        working-directory: artifacts/task-earn-pro
        run: |
          npx vercel deploy --prebuilt --prod \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
